<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempora — тестовая сборка</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(180deg,#12173a,#0b0f28); color:#fff;
         font-family:-apple-system,system-ui,sans-serif; text-align:center; }
  .card { padding:32px 24px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p  { font-size:14px; opacity:.75; margin:0 0 22px; line-height:1.5; }
  a.btn { display:inline-block; padding:14px 26px; border-radius:14px; font-size:16px; font-weight:600;
          color:#0b0f28; background:linear-gradient(180deg,#e8c877,#c9a24b); text-decoration:none; }
  #build { margin-top:14px; font-size:13px; opacity:.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>Тестовая сборка</h1>
    <p>Только для проверки. Семья ставит приложение<br>с главной страницы, не отсюда.</p>
    <a class="btn" id="go" href="#">Установить тестовую</a>
    <div id="build">загрузка…</div>
  </div>
  <script>
    fetch('beta.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        document.getElementById('build').textContent = 'build ' + j.build;
        document.getElementById('go').href =
          'itms-services://?action=download-manifest&url=https://plan.akoev.com/ios/' + j.manifest;
      })
      .catch(function () { document.getElementById('build').textContent = 'манифест не прочитался'; });
  </script>
</body>
</html>
